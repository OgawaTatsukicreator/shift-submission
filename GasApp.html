<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>月間シフト提出</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --surface: #ffffff;
        --surface-2: #f8fafc;
        --line: #d9e0e8;
        --text: #1f2937;
        --muted: #667085;
        --primary: #26734d;
        --primary-dark: #17583a;
        --danger: #c62828;
        --blue: #1d5fa7;
        --holiday: #f3f4f6;
        --shadow: 0 1px 3px rgba(16, 24, 40, 0.12);
        font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        max-width: 820px;
        margin: 0 auto;
        padding: 6px 6px 96px;
      }

      .header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 16px 2px 12px;
        background: rgba(244, 246, 248, 0.96);
        backdrop-filter: blur(12px);
      }

      .header h1,
      .header p {
        margin: 0;
      }

      .header h1 {
        font-size: 22px;
        letter-spacing: 0;
      }

      .header p {
        color: var(--muted);
        font-weight: 700;
      }

      .status {
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        padding: 4px 12px;
        border-radius: 999px;
        background: #e9f5ee;
        color: var(--primary-dark);
        font-size: 13px;
        font-weight: 800;
        white-space: nowrap;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 0 0 12px;
      }

      .tabs button {
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--muted);
        font-weight: 900;
      }

      .tabs button.is-active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }

      .view {
        display: none;
      }

      .view.is-active {
        display: block;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 14px;
        margin-bottom: 12px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      label {
        display: grid;
        gap: 6px;
        color: #344054;
        font-size: 13px;
        font-weight: 900;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        background: #fff;
        color: var(--text);
        outline: none;
      }

      textarea {
        resize: vertical;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(38, 115, 77, 0.14);
      }

      .month-nav,
      .tools,
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .month-nav {
        display: grid;
        grid-template-columns: 62px 1fr 62px;
        align-items: center;
        gap: 10px;
        min-height: 70px;
        padding: 8px;
        text-align: center;
      }

      .month-title strong,
      .month-title small {
        display: block;
      }

      .month-title small {
        color: var(--muted);
        font-weight: 700;
      }

      .button {
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 14px;
        background: var(--surface);
        color: var(--text);
        font-weight: 900;
      }

      #prevMonth,
      #nextMonth {
        width: 54px;
        height: 54px;
        min-height: 54px;
        display: inline-grid;
        place-items: center;
        border-radius: 999px;
        padding: 0;
        background: #2f8338;
        border-color: #2f8338;
        color: #fff;
        font-size: 0;
      }

      #prevMonth::before {
        content: "‹";
        font-size: 34px;
        line-height: 1;
      }

      #nextMonth::before {
        content: "›";
        font-size: 34px;
        line-height: 1;
      }

      .button.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }

      .tools {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .tools .button {
        min-height: 62px;
        border-radius: 999px;
        box-shadow: var(--shadow);
      }

      .button.danger {
        background: #fff5f5;
        border-color: #ffd2d2;
        color: var(--danger);
      }

      .calendar {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .day {
        min-width: 0;
        min-height: 112px;
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr);
        gap: 8px;
        padding: 10px;
        align-items: stretch;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
      }

      .day.sunday .date {
        background: #e3282e;
      }

      .day.saturday .date {
        background: #1e82df;
      }

      .date {
        min-height: 92px;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 2px;
        border-radius: 10px;
        background: #258234;
        color: #fff;
        text-align: center;
        font-weight: 900;
      }

      .date small {
        color: #fff;
        font-size: 13px;
      }

      .date-main {
        display: grid;
        gap: 0;
        line-height: 1;
      }

      .date-main .month {
        font-size: 13px;
      }

      .date-main .day-number {
        margin-top: 4px;
        font-size: 26px;
      }

      .day-fields {
        display: grid;
        gap: 7px;
        align-content: center;
      }

      .day-fields select[name="type"] {
        min-height: 58px;
        border-radius: 8px;
        background: #fff;
        font-size: 16px;
        font-weight: 900;
      }

      .time-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .time-row.is-hidden {
        display: none;
      }

      .message {
        min-height: 24px;
        margin: 0;
        color: var(--muted);
        font-weight: 800;
      }

      .message.error {
        color: var(--danger);
      }

      .message.success {
        color: var(--primary-dark);
      }

      .schedule-list {
        display: grid;
        gap: 8px;
      }

      .schedule-row {
        display: grid;
        grid-template-columns: 110px 1fr 120px 120px;
        gap: 8px;
        align-items: center;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-2);
      }

      .schedule-row strong {
        color: var(--primary-dark);
      }

      .empty {
        padding: 18px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        text-align: center;
        font-weight: 800;
      }

      @media (max-width: 900px) {
        .form-grid {
          grid-template-columns: 1fr 1fr;
        }

        .schedule-row {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 560px) {
        .header {
          grid-template-columns: 1fr;
        }

        .tabs,
        .form-grid,
        .schedule-row {
          grid-template-columns: 1fr;
        }

        .tools,
        .calendar {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .day {
          min-height: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <h1>月間シフト提出</h1>
          <p>エリア、店舗、名前を選択してシフト希望を提出します。</p>
        </div>
        <span class="status" id="connectionStatus">読込中</span>
      </header>

      <nav class="tabs" aria-label="表示切替">
        <button type="button" class="is-active" data-view="submitView">希望提出</button>
        <button type="button" data-view="scheduleView">希望・確定確認</button>
        <button type="button" data-view="ptView">PT申請</button>
      </nav>

      <section class="view is-active" id="submitView">
        <form id="shiftForm" autocomplete="on">
          <section class="panel">
            <div class="form-grid">
              <label>
                エリア
                <select name="areaId" id="areaSelect" required></select>
              </label>
              <label>
                店舗
                <select name="storeId" id="storeSelect" required></select>
              </label>
              <label>
                名前
                <select name="employeeId" id="employeeSelect" required></select>
              </label>
              <label>
                対象月
                <input name="month" id="monthInput" type="month" required>
              </label>
            </div>
          </section>

          <section class="panel month-nav">
            <button type="button" class="button" id="prevMonth">前月</button>
            <div class="month-title">
              <strong id="monthTitle"></strong>
              <small id="monthRange"></small>
            </div>
            <button type="button" class="button" id="nextMonth">翌月</button>
          </section>

          <section class="panel tools">
            <button type="button" class="button primary" data-fill="work">全日 勤務可能</button>
            <button type="button" class="button" data-fill="holiday">全日 休み希望</button>
            <button type="button" class="button danger" data-fill="clear">全日 未入力</button>
          </section>

          <section class="calendar" id="calendarGrid"></section>

          <section class="panel">
            <label>
              備考
              <textarea name="notes" rows="3" placeholder="固定休、早上がり、相談したい日など"></textarea>
            </label>
          </section>

          <section class="panel actions">
            <button type="submit" class="button primary">シフト希望を提出</button>
            <button type="button" class="button" id="loadDraft">下書きを復元</button>
            <button type="reset" class="button danger">入力をクリア</button>
            <p class="message" id="message" role="status"></p>
          </section>
        </form>
      </section>

      <section class="view" id="scheduleView">
        <section class="panel">
          <div class="form-grid">
            <label>
              エリア
              <select id="scheduleAreaSelect"></select>
            </label>
            <label>
              店舗
              <select id="scheduleStoreSelect"></select>
            </label>
            <label>
              名前
              <select id="scheduleEmployeeSelect"></select>
            </label>
            <label>
              対象月
              <input id="scheduleMonthInput" type="month">
            </label>
          </div>
        </section>
        <section class="panel actions">
          <button type="button" class="button primary" id="loadSchedule">希望・確定を表示</button>
          <p class="message" id="scheduleMessage"></p>
        </section>
        <section class="schedule-list" id="scheduleList"></section>
      </section>

      <section class="view" id="ptView">
        <form id="ptForm">
          <section class="panel">
            <div class="form-grid">
              <label>
                エリア
                <select name="areaId" id="ptAreaSelect" required></select>
              </label>
              <label>
                店舗
                <select name="storeId" id="ptStoreSelect" required></select>
              </label>
              <label>
                名前
                <select name="employeeId" id="ptEmployeeSelect" required></select>
              </label>
              <label>
                PT勤務日
                <input name="date" type="date" required>
              </label>
              <label>
                開始
                <select name="start" id="ptStart"></select>
              </label>
              <label>
                終了
                <select name="end" id="ptEnd"></select>
              </label>
            </div>
          </section>
          <section class="panel">
            <label>
              備考
              <textarea name="notes" rows="3" placeholder="PT申請の補足"></textarea>
            </label>
          </section>
          <section class="panel actions">
            <button type="submit" class="button primary">PTを申請</button>
            <p class="message" id="ptMessage"></p>
          </section>
        </form>
      </section>
    </main>

    <template id="dayTemplate">
      <article class="day">
        <div class="date">
          <span class="date-main"></span>
          <small class="weekday"></small>
        </div>
        <div class="day-fields">
          <select name="type">
            <option value="未入力">未入力</option>
            <option value="勤務可能">勤務可能</option>
            <option value="休み希望">休み希望</option>
            <option value="有給希望">有給希望</option>
            <option value="PT">PT</option>
          </select>
          <div class="time-row is-hidden">
            <select name="start"></select>
            <select name="end"></select>
          </div>
        </div>
      </article>
    </template>

    <script>
      const DEFAULT_START = "11:00";
      const DEFAULT_END = "20:00";
      const DEADLINE_DAY = 15;
      const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
      const storageKey = "shift-form-draft-v2";
      const state = {
        areas: [],
        stores: [],
        staff: [],
        staffStoreSettings: [],
      };
      const fallbackData = {
        accepting: true,
        areas: [
          { areaId: "AREA_NORTH", areaName: "城北エリア" },
          { areaId: "AREA_WEST", areaName: "八王子エリア" },
          { areaId: "AREA_EAST", areaName: "東エリア" },
        ],
        stores: [
          { storeId: "STORE_OYAMA", areaId: "AREA_NORTH", storeName: "大山" },
          { storeId: "STORE_NARIMASU", areaId: "AREA_NORTH", storeName: "成増" },
          { storeId: "STORE_ITABASHI", areaId: "AREA_NORTH", storeName: "板橋" },
          { storeId: "STORE_AKATSUKA", areaId: "AREA_NORTH", storeName: "赤塚" },
          { storeId: "STORE_IKEBUKURO", areaId: "AREA_NORTH", storeName: "池袋" },
          { storeId: "STORE_HACHIOJI", areaId: "AREA_WEST", storeName: "八王子" },
          { storeId: "STORE_NISHIHACHI", areaId: "AREA_WEST", storeName: "西八王子" },
          { storeId: "STORE_MINAMINO", areaId: "AREA_WEST", storeName: "八王子みなみ野" },
          { storeId: "STORE_KASAI", areaId: "AREA_EAST", storeName: "葛西" },
        ],
        staff: [
          { employeeId: "EMP001", name: "笠原丈" },
          { employeeId: "EMP002", name: "比嘉里奈" },
          { employeeId: "EMP003", name: "須藤友樹" },
          { employeeId: "EMP004", name: "福岡渓吾" },
          { employeeId: "EMP005", name: "生江健仁" },
          { employeeId: "EMP006", name: "松田渉" },
          { employeeId: "EMP007", name: "加藤慎也" },
          { employeeId: "EMP008", name: "中澤可林" },
          { employeeId: "EMP009", name: "西久保豪海" },
          { employeeId: "EMP010", name: "加藤はるか" },
          { employeeId: "EMP011", name: "小川樹" },
        ],
        staffStoreSettings: [
          { employeeId: "EMP001", areaId: "AREA_NORTH", storeId: "STORE_OYAMA", normalDisplay: true, helpCandidate: true },
          { employeeId: "EMP002", areaId: "AREA_WEST", storeId: "STORE_HACHIOJI", normalDisplay: true, helpCandidate: true },
          { employeeId: "EMP003", areaId: "AREA_NORTH", storeId: "STORE_OYAMA", normalDisplay: true, helpCandidate: true },
          { employeeId: "EMP004", areaId: "AREA_NORTH", storeId: "STORE_NARIMASU", normalDisplay: true, helpCandidate: true },
          { employeeId: "EMP005", areaId: "AREA_NORTH", storeId: "STORE_ITABASHI", normalDisplay: true, helpCandidate: true },
          { employeeId: "EMP006", areaId: "AREA_NORTH", storeId: "STORE_AKATSUKA", normalDisplay: true, helpCandidate: true },
          { employeeId: "EMP007", areaId: "AREA_NORTH", storeId: "STORE_IKEBUKURO", normalDisplay: true, helpCandidate: true },
          { employeeId: "EMP008", areaId: "AREA_EAST", storeId: "STORE_KASAI", normalDisplay: true, helpCandidate: true },
          { employeeId: "EMP009", areaId: "AREA_WEST", storeId: "STORE_HACHIOJI", normalDisplay: true, helpCandidate: true },
          { employeeId: "EMP010", areaId: "AREA_NORTH", storeId: "STORE_OYAMA", normalDisplay: true, helpCandidate: true },
          { employeeId: "EMP011", areaId: "AREA_WEST", storeId: "STORE_MINAMINO", normalDisplay: true, helpCandidate: true },
        ],
      };

      const elements = {
        status: document.querySelector("#connectionStatus"),
        shiftForm: document.querySelector("#shiftForm"),
        area: document.querySelector("#areaSelect"),
        store: document.querySelector("#storeSelect"),
        employee: document.querySelector("#employeeSelect"),
        month: document.querySelector("#monthInput"),
        calendar: document.querySelector("#calendarGrid"),
        dayTemplate: document.querySelector("#dayTemplate"),
        monthTitle: document.querySelector("#monthTitle"),
        monthRange: document.querySelector("#monthRange"),
        message: document.querySelector("#message"),
        scheduleArea: document.querySelector("#scheduleAreaSelect"),
        scheduleStore: document.querySelector("#scheduleStoreSelect"),
        scheduleEmployee: document.querySelector("#scheduleEmployeeSelect"),
        scheduleMonth: document.querySelector("#scheduleMonthInput"),
        scheduleMessage: document.querySelector("#scheduleMessage"),
        scheduleList: document.querySelector("#scheduleList"),
        ptForm: document.querySelector("#ptForm"),
        ptArea: document.querySelector("#ptAreaSelect"),
        ptStore: document.querySelector("#ptStoreSelect"),
        ptEmployee: document.querySelector("#ptEmployeeSelect"),
        ptStart: document.querySelector("#ptStart"),
        ptEnd: document.querySelector("#ptEnd"),
        ptMessage: document.querySelector("#ptMessage"),
      };

      function setMessage(node, text, type = "") {
        node.textContent = text;
        node.className = `message ${type}`.trim();
      }

      function getDefaultMonth() {
        const today = new Date();
        return toMonthValue(new Date(today.getFullYear(), today.getMonth() + 1, 1));
      }

      function toMonthValue(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
      }

      function parseMonth(value) {
        if (!value) return parseMonth(getDefaultMonth());
        const [year, month] = value.split("-").map(Number);
        if (!year || !month) return parseMonth(getDefaultMonth());
        return new Date(year, month - 1, 1);
      }

      function daysInMonth(value) {
        const date = parseMonth(value);
        return new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
      }

      function buildHourOptions(select, firstLabel = "選択") {
        select.innerHTML = `<option value="">${firstLabel}</option>`;
        for (let hour = 6; hour <= 24; hour++) {
          const option = document.createElement("option");
          option.value = `${String(hour).padStart(2, "0")}:00`;
          option.textContent = `${hour}:00`;
          select.append(option);
        }
      }

      function fillSelect(select, options, placeholder, valueKey, labelKey) {
        select.innerHTML = `<option value="">${placeholder}</option>`;
        options.forEach((item) => {
          const option = document.createElement("option");
          option.value = item[valueKey];
          option.textContent = item[labelKey];
          select.append(option);
        });
      }

      function storesByArea(areaId) {
        return state.stores.filter((store) => store.areaId === areaId);
      }

      function employeesByStore(storeId, help = false) {
        const employeeIds = state.staffStoreSettings
          .filter((setting) => setting.storeId === storeId && (help ? setting.helpCandidate : setting.normalDisplay))
          .map((setting) => setting.employeeId);
        return state.staff.filter((staff) => employeeIds.includes(staff.employeeId));
      }

      function syncStoreOptions(areaSelect, storeSelect, employeeSelect, help = false) {
        // エリア選択に応じて店舗候補を更新し、続けて名前候補も更新する。
        console.log("[syncStoreOptions] 店舗候補更新", { areaId: areaSelect.value, help });
        const stores = storesByArea(areaSelect.value);
        fillSelect(storeSelect, stores, "店舗を選択", "storeId", "storeName");
        if (stores.length) {
          storeSelect.value = stores[0].storeId;
        }
        syncEmployeeOptions(storeSelect, employeeSelect, help);
      }

      function syncEmployeeOptions(storeSelect, employeeSelect, help = false) {
        // 店舗選択に応じて、通常表示またはヘルプ候補の従業員だけを表示する。
        console.log("[syncEmployeeOptions] 名前候補更新", { storeId: storeSelect.value, help });
        const employees = employeesByStore(storeSelect.value, help);
        fillSelect(employeeSelect, employees, "名前を選択", "employeeId", "name");
        if (employees.length) {
          employeeSelect.value = employees[0].employeeId;
        }
      }

      function updateMonthHeader() {
        if (!elements.month.value) {
          elements.month.value = getDefaultMonth();
        }
        const month = parseMonth(elements.month.value);
        const monthNumber = month.getMonth() + 1;
        const lastDay = daysInMonth(elements.month.value);
        elements.monthTitle.textContent = `${month.getFullYear()}/${String(monthNumber).padStart(2, "0")}/01 - ${String(monthNumber).padStart(2, "0")}/${lastDay}`;
        elements.monthRange.textContent = `通常シフト提出期限: 毎月${DEADLINE_DAY}日`;
      }

      function renderCalendar(existing = {}) {
        // 対象月の日数に合わせて、1か月分の入力カードを描画する。
        console.log("[renderCalendar] カレンダー描画開始", { month: elements.month.value, existing: Object.keys(existing).length });
        if (!elements.month.value) {
          elements.month.value = getDefaultMonth();
        }
        elements.calendar.innerHTML = "";
        const monthValue = elements.month.value;
        const date = parseMonth(monthValue);
        const year = date.getFullYear();
        const month = date.getMonth();
        const totalDays = daysInMonth(monthValue);

        for (let day = 1; day <= totalDays; day++) {
          const current = new Date(year, month, day);
          const dateValue = `${monthValue}-${String(day).padStart(2, "0")}`;
          const saved = existing[dateValue] || {};
          const card = elements.dayTemplate.content.firstElementChild.cloneNode(true);
          const weekday = current.getDay();
          card.dataset.date = dateValue;
          if (weekday === 0) card.classList.add("sunday");
          if (weekday === 6) card.classList.add("saturday");
          card.querySelector(".date-main").innerHTML = `<span class="month">${month + 1}/</span><span class="day-number">${day}</span>`;
          card.querySelector(".weekday").textContent = weekdays[weekday];

          const type = card.querySelector('[name="type"]');
          const start = card.querySelector('[name="start"]');
          const end = card.querySelector('[name="end"]');
          buildHourOptions(start, "開始");
          buildHourOptions(end, "終了");
          type.value = saved.type || "未入力";
          start.value = saved.start || "";
          end.value = saved.end || "";
          refreshTimeVisibility(card);

          type.addEventListener("input", () => {
            if (["勤務可能", "PT"].includes(type.value)) {
              if (!start.value) start.value = DEFAULT_START;
              if (!end.value) end.value = DEFAULT_END;
            } else {
              start.value = "";
              end.value = "";
            }
            refreshTimeVisibility(card);
            saveDraft();
          });
          start.addEventListener("input", saveDraft);
          end.addEventListener("input", saveDraft);
          elements.calendar.append(card);
        }
        updateMonthHeader();
        console.log("[renderCalendar] カレンダー描画完了", { days: totalDays });
      }

      function refreshTimeVisibility(card) {
        const type = card.querySelector('[name="type"]').value;
        card.querySelector(".time-row").classList.toggle("is-hidden", !["勤務可能", "PT"].includes(type));
      }

      function collectPayload() {
        const formData = new FormData(elements.shiftForm);
        const employee = state.staff.find((item) => item.employeeId === formData.get("employeeId"));
        const shifts = [...elements.calendar.querySelectorAll(".day")].map((card) => ({
          date: card.dataset.date,
          type: card.querySelector('[name="type"]').value,
          start: card.querySelector('[name="start"]').value,
          end: card.querySelector('[name="end"]').value,
        }));
        return {
          areaId: formData.get("areaId"),
          storeId: formData.get("storeId"),
          employeeId: formData.get("employeeId"),
          name: employee ? employee.name : "",
          month: formData.get("month"),
          notes: formData.get("notes").trim(),
          shifts,
        };
      }

      function groupShiftsByDate(shifts = []) {
        return Object.fromEntries(shifts.map((shift) => [shift.date, shift]));
      }

      function saveDraft() {
        // 入力中の内容をブラウザのローカルストレージに保存する。
        console.log("[saveDraft] 下書き保存");
        localStorage.setItem(storageKey, JSON.stringify(collectPayload()));
      }

      function restoreDraft() {
        // ローカルストレージから下書きを復元する。
        console.log("[restoreDraft] 下書き復元開始");
        const saved = localStorage.getItem(storageKey);
        if (!saved) {
          renderCalendar();
          console.log("[restoreDraft] 下書きなし");
          return;
        }
        const data = JSON.parse(saved);
        const hasSavedArea = state.areas.some((area) => area.areaId === data.areaId);
        elements.area.value = hasSavedArea ? data.areaId : elements.area.value;
        syncStoreOptions(elements.area, elements.store, elements.employee);
        const hasSavedStore = storesByArea(elements.area.value).some((store) => store.storeId === data.storeId);
        if (hasSavedStore) elements.store.value = data.storeId;
        syncEmployeeOptions(elements.store, elements.employee);
        const hasSavedEmployee = employeesByStore(elements.store.value).some((employee) => employee.employeeId === data.employeeId);
        if (hasSavedEmployee) elements.employee.value = data.employeeId;
        elements.month.value = data.month || elements.month.value || getDefaultMonth();
        elements.shiftForm.elements.notes.value = data.notes || "";
        renderCalendar(groupShiftsByDate(data.shifts));
        console.log("[restoreDraft] 下書き復元完了", { month: elements.month.value });
      }

      function moveMonth(amount) {
        const current = parseMonth(elements.month.value);
        current.setMonth(current.getMonth() + amount);
        elements.month.value = toMonthValue(current);
        renderCalendar(groupShiftsByDate(collectPayload().shifts));
        saveDraft();
      }

      function fillAll(mode) {
        // 1か月分のカードへ一括入力する。
        console.log("[fillAll] 一括入力", { mode });
        elements.calendar.querySelectorAll(".day").forEach((card) => {
          const type = card.querySelector('[name="type"]');
          const start = card.querySelector('[name="start"]');
          const end = card.querySelector('[name="end"]');
          if (mode === "work") {
            type.value = "勤務可能";
            start.value = DEFAULT_START;
            end.value = DEFAULT_END;
          }
          if (mode === "holiday") {
            type.value = "休み希望";
            start.value = "";
            end.value = "";
          }
          if (mode === "clear") {
            type.value = "未入力";
            start.value = "";
            end.value = "";
          }
          refreshTimeVisibility(card);
        });
        saveDraft();
      }

      function submitShift(event) {
        // 月間シフト希望をGASへ送信する。
        event.preventDefault();
        if (!hasGoogleRunner()) {
          setMessage(elements.message, "GAS上で開くと送信できます。現在は画面確認モードです。", "error");
          console.log("[submitShift] GASランナーなし");
          return;
        }
        const payload = collectPayload();
        console.log("[submitShift] 提出開始", {
          employeeId: payload.employeeId,
          areaId: payload.areaId,
          storeId: payload.storeId,
          month: payload.month,
        });
        const requested = payload.shifts.filter((shift) => shift.type !== "未入力");
        if (!payload.areaId || !payload.storeId || !payload.employeeId || !payload.month) {
          setMessage(elements.message, "エリア、店舗、名前、対象月を選択してください。", "error");
          return;
        }
        if (!requested.length) {
          setMessage(elements.message, "勤務可能・休み希望・有給希望・PTのどれかを1日以上入力してください。", "error");
          return;
        }
        setMessage(elements.message, "送信中です...");
        elements.shiftForm.querySelector('[type="submit"]').disabled = true;
        google.script.run
          .withSuccessHandler((result) => {
            console.log("[submitShift] 提出成功", result);
            localStorage.setItem(storageKey, JSON.stringify(payload));
            setMessage(elements.message, result.updated ? "変更を保存しました。" : "シフト希望を提出しました。", "success");
            elements.shiftForm.querySelector('[type="submit"]').disabled = false;
          })
          .withFailureHandler((error) => {
            console.error("[submitShift] 提出失敗", error);
            setMessage(elements.message, error.message || "送信に失敗しました。", "error");
            elements.shiftForm.querySelector('[type="submit"]').disabled = false;
          })
          .submitShift(payload);
      }

      function submitPt(event) {
        // PT申請をGASへ送信する。
        event.preventDefault();
        if (!hasGoogleRunner()) {
          setMessage(elements.ptMessage, "GAS上で開くとPT申請できます。現在は画面確認モードです。", "error");
          console.log("[submitPt] GASランナーなし");
          return;
        }
        const formData = new FormData(elements.ptForm);
        const employee = state.staff.find((item) => item.employeeId === formData.get("employeeId"));
        const payload = {
          kind: "pt",
          employeeId: formData.get("employeeId"),
          name: employee ? employee.name : "",
          workAreaId: formData.get("areaId"),
          workStoreId: formData.get("storeId"),
          date: formData.get("date"),
          start: formData.get("start"),
          end: formData.get("end"),
          notes: formData.get("notes"),
        };
        console.log("[submitPt] PT申請開始", payload);
        setMessage(elements.ptMessage, "PT申請を送信中です...");
        google.script.run
          .withSuccessHandler((result) => {
            console.log("[submitPt] PT申請成功", result);
            setMessage(elements.ptMessage, "PT申請を確定シフトへ反映しました。", "success");
          })
          .withFailureHandler((error) => {
            console.error("[submitPt] PT申請失敗", error);
            setMessage(elements.ptMessage, error.message || "PT申請に失敗しました。", "error");
          })
          .submitPtRequest(payload);
      }

      function loadSchedule() {
        // 選択した従業員の希望・確定シフトをGASから取得する。
        if (!hasGoogleRunner()) {
          setMessage(elements.scheduleMessage, "GAS上で開くと希望・確定シフトを取得できます。現在は画面確認モードです。", "error");
          console.log("[loadSchedule] GASランナーなし");
          return;
        }
        const employee = state.staff.find((item) => item.employeeId === elements.scheduleEmployee.value);
        if (!employee || !elements.scheduleMonth.value) {
          setMessage(elements.scheduleMessage, "名前と対象月を選択してください。", "error");
          return;
        }
        console.log("[loadSchedule] スケジュール取得開始", { employeeId: employee.employeeId, month: elements.scheduleMonth.value });
        setMessage(elements.scheduleMessage, "読込中です...");
        elements.scheduleList.innerHTML = "";
        google.script.run
          .withSuccessHandler(renderSchedule)
          .withFailureHandler((error) => {
            console.error("[loadSchedule] スケジュール取得失敗", error);
            setMessage(elements.scheduleMessage, error.message || "読込に失敗しました。", "error");
          })
          .getMySchedule({ employeeId: employee.employeeId, month: elements.scheduleMonth.value });
      }

      function renderSchedule(data) {
        // GASから取得した希望・確定シフトを一覧表示する。
        if (!data || data.ok === false) {
          console.error("[renderSchedule] 不正なレスポンス", data);
          setMessage(elements.scheduleMessage, (data && data.error) || "スケジュールデータの形式が不正です。", "error");
          elements.scheduleList.innerHTML = "";
          return;
        }
        const confirmed = Array.isArray(data.confirmed) ? data.confirmed : [];
        const hopes = Array.isArray(data.hopes) ? data.hopes : [];
        console.log("[renderSchedule] スケジュール描画", {
          confirmed: confirmed.length,
          hopes: hopes.length,
        });
        setMessage(elements.scheduleMessage, "表示しました。", "success");
        const rows = [];
        confirmed.forEach((item) => {
          rows.push({
            date: item.date,
            title: item.type,
            store: item.workStoreName || item.workStoreId,
            time: [item.start, item.end].filter(Boolean).join("-"),
            kind: "確定",
          });
        });
        hopes.forEach((item) => {
          if (item.type === "未入力") return;
          rows.push({
            date: item.date,
            title: item.type,
            store: "希望",
            time: [item.start, item.end].filter(Boolean).join("-"),
            kind: "希望",
          });
        });
        rows.sort((a, b) => a.date.localeCompare(b.date) || a.kind.localeCompare(b.kind));
        if (!rows.length) {
          elements.scheduleList.innerHTML = '<div class="empty">表示できる希望・確定シフトがありません。</div>';
          return;
        }
        elements.scheduleList.innerHTML = rows.map((row) => `
          <div class="schedule-row">
            <strong>${row.date}</strong>
            <span>${row.kind}: ${row.title}</span>
            <span>${row.store}</span>
            <span>${row.time || "-"}</span>
          </div>
        `).join("");
      }

      function applyInitialData(data) {
        // GASから取得したマスタ情報を画面の選択肢へ反映する。
        console.log("[applyInitialData] 初期データ反映開始", data);
        data = normalizeInitialData(data);
        Object.assign(state, {
          areas: data.areas,
          stores: data.stores,
          staff: data.staff,
          staffStoreSettings: data.staffStoreSettings,
        });
        [elements.area, elements.scheduleArea, elements.ptArea].forEach((select) => fillSelect(select, state.areas, "エリアを選択", "areaId", "areaName"));
        elements.area.value = state.areas[0] ? state.areas[0].areaId : "";
        elements.scheduleArea.value = elements.area.value;
        elements.ptArea.value = elements.area.value;
        syncStoreOptions(elements.area, elements.store, elements.employee);
        syncStoreOptions(elements.scheduleArea, elements.scheduleStore, elements.scheduleEmployee);
        syncStoreOptions(elements.ptArea, elements.ptStore, elements.ptEmployee, true);
        elements.month.value = getDefaultMonth();
        elements.scheduleMonth.value = elements.month.value;
        buildHourOptions(elements.ptStart, "開始");
        buildHourOptions(elements.ptEnd, "終了");
        elements.ptStart.value = DEFAULT_START;
        elements.ptEnd.value = DEFAULT_END;
        restoreDraft();
        elements.status.textContent = data.accepting ? "受付中" : "受付停止中";
        console.log("[applyInitialData] 初期データ反映完了", {
          areas: state.areas.length,
          stores: state.stores.length,
          staff: state.staff.length,
        });
      }

      function normalizeInitialData(data) {
        const source = data && Array.isArray(data.areas) && data.areas.length ? data : fallbackData;
        return {
          accepting: source.accepting !== false,
          areas: source.areas || [],
          stores: source.stores || [],
          staff: source.staff || [],
          staffStoreSettings: (source.staffStoreSettings || []).map((setting) => ({
            ...setting,
            normalDisplay: setting.normalDisplay !== false,
            helpCandidate: setting.helpCandidate !== false,
          })),
        };
      }

      function hasGoogleRunner() {
        return typeof google !== "undefined" && google.script && google.script.run;
      }

      function bootWithFallback(reason) {
        // GAS外で開いた場合や初期データ取得に失敗した場合の画面確認用起動。
        console.log("[bootWithFallback] フォールバック起動", { reason });
        applyInitialData(fallbackData);
        elements.status.textContent = "画面確認";
        if (reason) {
          setMessage(elements.message, reason, "error");
        }
      }

      document.querySelectorAll(".tabs button").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".tabs button").forEach((item) => item.classList.remove("is-active"));
          document.querySelectorAll(".view").forEach((view) => view.classList.remove("is-active"));
          button.classList.add("is-active");
          document.querySelector(`#${button.dataset.view}`).classList.add("is-active");
        });
      });

      elements.area.addEventListener("input", () => {
        syncStoreOptions(elements.area, elements.store, elements.employee);
        saveDraft();
      });
      elements.store.addEventListener("input", () => {
        syncEmployeeOptions(elements.store, elements.employee);
        saveDraft();
      });
      elements.employee.addEventListener("input", saveDraft);
      elements.month.addEventListener("input", () => {
        renderCalendar(groupShiftsByDate(collectPayload().shifts));
        saveDraft();
      });
      elements.shiftForm.addEventListener("input", saveDraft);
      elements.shiftForm.addEventListener("submit", submitShift);
      elements.shiftForm.addEventListener("reset", () => {
        setTimeout(() => {
          localStorage.removeItem(storageKey);
          elements.month.value = getDefaultMonth();
          renderCalendar();
          setMessage(elements.message, "入力内容をクリアしました。");
        });
      });
      document.querySelector("#prevMonth").addEventListener("click", () => moveMonth(-1));
      document.querySelector("#nextMonth").addEventListener("click", () => moveMonth(1));
      document.querySelector("#loadDraft").addEventListener("click", restoreDraft);
      document.querySelectorAll("[data-fill]").forEach((button) => button.addEventListener("click", () => fillAll(button.dataset.fill)));

      elements.scheduleArea.addEventListener("input", () => syncStoreOptions(elements.scheduleArea, elements.scheduleStore, elements.scheduleEmployee));
      elements.scheduleStore.addEventListener("input", () => syncEmployeeOptions(elements.scheduleStore, elements.scheduleEmployee));
      document.querySelector("#loadSchedule").addEventListener("click", loadSchedule);

      elements.ptArea.addEventListener("input", () => syncStoreOptions(elements.ptArea, elements.ptStore, elements.ptEmployee, true));
      elements.ptStore.addEventListener("input", () => syncEmployeeOptions(elements.ptStore, elements.ptEmployee, true));
      elements.ptForm.addEventListener("submit", submitPt);

      elements.month.value = getDefaultMonth();
      elements.scheduleMonth.value = elements.month.value;
      renderCalendar();

      if (hasGoogleRunner()) {
        google.script.run
          .withSuccessHandler(applyInitialData)
          .withFailureHandler((error) => {
            bootWithFallback(error.message || "初期データの読込に失敗したため、画面確認モードで表示しています。");
          })
          .getInitialData();
      } else {
        bootWithFallback("GAS以外で開いているため、画面確認モードで表示しています。");
      }
    </script>
  </body>
</html>
