<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>シフト提出・希望確認</title>
    <style>
      :root {
        --bg: #f4f6f8;
        --surface: #ffffff;
        --surface-2: #f8fafc;
        --line: #d9e0e8;
        --text: #1f2937;
        --muted: #667085;
        --primary: #26734d;
        --primary-dark: #17583a;
        --danger: #c62828;
        --blue: #1d5fa7;
        --holiday: #f3f4f6;
        --shadow: 0 1px 3px rgba(16, 24, 40, 0.12);
        font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
      }

      .is-hidden {
        display: none !important;
      }

      .auth-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 14px;
      }

      .auth-frame {
        width: min(460px, 100%);
      }

      .auth-brand {
        margin-bottom: 16px;
      }

      .auth-brand h1,
      .auth-brand p {
        margin: 0;
      }

      .auth-brand h1 {
        font-size: 28px;
        letter-spacing: 0;
      }

      .auth-brand p {
        margin-top: 6px;
        color: var(--muted);
        font-weight: 700;
        line-height: 1.55;
      }

      .auth-panel {
        overflow: hidden;
        border: 1px solid var(--line);
        border-top: 5px solid var(--primary);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 14px 32px rgba(16, 24, 40, 0.13);
      }

      .auth-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-bottom: 1px solid var(--line);
        background: var(--surface-2);
      }

      .auth-tabs button {
        min-height: 50px;
        border: 0;
        border-bottom: 3px solid transparent;
        background: transparent;
        color: var(--muted);
        font-weight: 900;
      }

      .auth-tabs button.is-active {
        border-bottom-color: var(--primary);
        background: var(--surface);
        color: var(--primary-dark);
      }

      .auth-pane {
        display: none;
        padding: 22px;
      }

      .auth-pane.is-active {
        display: block;
      }

      .auth-pane h2,
      .auth-pane > p {
        margin: 0;
      }

      .auth-pane h2 {
        font-size: 19px;
        letter-spacing: 0;
      }

      .auth-pane > p {
        margin-top: 5px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 700;
        line-height: 1.55;
      }

      .auth-form {
        display: grid;
        gap: 14px;
        margin-top: 20px;
      }

      .auth-form .button {
        width: 100%;
        min-height: 50px;
      }

      .auth-message {
        min-height: 24px;
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 14px;
        font-weight: 800;
        line-height: 1.5;
      }

      .auth-message.error {
        color: var(--danger);
      }

      .auth-message.success {
        color: var(--primary-dark);
      }

      .password-rule,
      .field-note {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        line-height: 1.4;
      }

      .employee-proof {
        display: grid;
        grid-template-columns: 8px 1fr;
        overflow: hidden;
        border: 1px solid #b9d9c7;
        border-radius: 8px;
        background: #f3faf6;
      }

      .employee-proof::before {
        content: "";
        background: var(--primary);
      }

      .employee-proof-body {
        padding: 12px 14px;
      }

      .employee-proof span,
      .employee-proof strong {
        display: block;
      }

      .employee-proof span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
      }

      .employee-proof strong {
        margin-top: 2px;
        font-size: 18px;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease, background-color 120ms ease;
        touch-action: manipulation;
      }

      button:active,
      button.is-pressing {
        transform: translateY(1px) scale(0.98);
        filter: brightness(0.94);
        box-shadow: inset 0 2px 5px rgba(15, 23, 42, 0.18);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.62;
      }

      button:disabled:active,
      button:disabled.is-pressing {
        transform: none;
        filter: none;
      }

      .app {
        max-width: 820px;
        margin: 0 auto;
        padding: 6px 6px 96px;
      }

      .app:focus {
        outline: none;
      }

      .header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 16px 2px 12px;
        background: rgba(244, 246, 248, 0.96);
        backdrop-filter: blur(12px);
      }

      .header-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }

      .user-chip {
        min-width: 0;
        display: grid;
        padding: 6px 10px;
        border-left: 3px solid var(--primary);
        background: #eef7f2;
      }

      .user-chip strong,
      .user-chip span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .user-chip strong {
        font-size: 13px;
      }

      .user-chip span {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .account-button,
      .logout-button {
        min-height: 38px;
        padding: 6px 10px;
        font-size: 12px;
      }

      .header h1,
      .header p {
        margin: 0;
      }

      .header h1 {
        font-size: 22px;
        letter-spacing: 0;
      }

      .header p {
        color: var(--muted);
        font-weight: 700;
      }

      .status {
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        padding: 4px 12px;
        border-radius: 999px;
        background: #e9f5ee;
        color: var(--primary-dark);
        font-size: 13px;
        font-weight: 800;
        white-space: nowrap;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 0 0 12px;
      }

      .tabs button {
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--muted);
        font-weight: 900;
      }

      .tabs button.is-active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }

      .view {
        display: none;
      }

      .view.is-active {
        display: block;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 14px;
        margin-bottom: 12px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .hope-controls {
        display: grid;
        grid-template-columns: minmax(180px, 320px) auto;
        gap: 10px;
        align-items: end;
      }

      .hope-controls .button {
        min-height: 46px;
      }

      label {
        display: grid;
        gap: 6px;
        color: #344054;
        font-size: 13px;
        font-weight: 900;
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        background: #fff;
        color: var(--text);
        outline: none;
      }

      textarea {
        resize: vertical;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(38, 115, 77, 0.14);
      }

      select:disabled,
      input:read-only {
        border-color: #cbd5df;
        background: #eef2f5;
        color: #344054;
        opacity: 1;
      }

      .month-nav,
      .tools,
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .month-nav {
        display: grid;
        grid-template-columns: 62px 1fr 62px;
        align-items: center;
        gap: 10px;
        min-height: 70px;
        padding: 8px;
        text-align: center;
      }

      .month-title strong,
      .month-title small {
        display: block;
      }

      .month-title small {
        color: var(--muted);
        font-weight: 700;
      }

      .button {
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 14px;
        background: var(--surface);
        color: var(--text);
        font-weight: 900;
      }

      #prevMonth,
      #nextMonth {
        width: 54px;
        height: 54px;
        min-height: 54px;
        display: inline-grid;
        place-items: center;
        border-radius: 999px;
        padding: 0;
        background: #2f8338;
        border-color: #2f8338;
        color: #fff;
        font-size: 0;
      }

      #prevMonth::before {
        content: "‹";
        font-size: 34px;
        line-height: 1;
      }

      #nextMonth::before {
        content: "›";
        font-size: 34px;
        line-height: 1;
      }

      .button.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }

      .tools {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .tools .button {
        min-height: 62px;
        border-radius: 999px;
        box-shadow: var(--shadow);
      }

      .button.danger {
        background: #fff5f5;
        border-color: #ffd2d2;
        color: var(--danger);
      }

      .calendar {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .day {
        min-width: 0;
        min-height: 112px;
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr);
        gap: 8px;
        padding: 10px;
        align-items: stretch;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
      }

      .day.has-error {
        border-color: var(--danger);
        box-shadow: 0 0 0 3px rgba(209, 47, 47, 0.14);
      }

      .day.sunday .date {
        background: #e3282e;
      }

      .day.saturday .date {
        background: #1e82df;
      }

      .date {
        min-height: 92px;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 2px;
        border-radius: 10px;
        background: #258234;
        color: #fff;
        text-align: center;
        font-weight: 900;
      }

      .date small {
        color: #fff;
        font-size: 13px;
      }

      .date-main {
        display: grid;
        gap: 0;
        line-height: 1;
      }

      .date-main .month {
        font-size: 13px;
      }

      .date-main .day-number {
        margin-top: 4px;
        font-size: 26px;
      }

      .day-fields {
        display: grid;
        gap: 7px;
        align-content: center;
      }

      .day-fields select[name="type"] {
        min-height: 58px;
        border-radius: 8px;
        background: #fff;
        font-size: 16px;
        font-weight: 900;
      }

      .time-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .time-row.is-hidden {
        display: none;
      }

      .message {
        min-height: 24px;
        margin: 0;
        color: var(--muted);
        font-weight: 800;
      }

      .message.error {
        color: var(--danger);
      }

      .message.success {
        color: var(--primary-dark);
      }

      .schedule-list {
        display: grid;
        gap: 8px;
      }

      .schedule-row {
        display: grid;
        grid-template-columns: 110px 1fr 120px 120px;
        gap: 8px;
        align-items: center;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-2);
      }

      .schedule-row strong {
        color: var(--primary-dark);
      }

      .empty {
        padding: 18px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        text-align: center;
        font-weight: 800;
      }

      .confirm-backdrop,
      .password-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        place-items: center;
        padding: 18px;
        background: rgba(15, 23, 42, 0.42);
      }

      .password-backdrop {
        z-index: 60;
      }

      .confirm-backdrop.is-open,
      .password-backdrop.is-open {
        display: grid;
      }

      .confirm-dialog,
      .password-dialog {
        width: min(420px, 100%);
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        box-shadow: 0 18px 48px rgba(15, 23, 42, 0.24);
        padding: 18px;
      }

      .confirm-dialog h2,
      .password-dialog h2 {
        margin: 0 0 8px;
        font-size: 18px;
        letter-spacing: 0;
      }

      .confirm-dialog p {
        margin: 0;
        color: var(--muted);
        font-weight: 800;
        line-height: 1.55;
      }

      .confirm-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 18px;
      }

      .password-form {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }

      .password-form .message {
        line-height: 1.5;
      }

      .result-backdrop {
        position: fixed;
        inset: 0;
        z-index: 70;
        display: none;
        place-items: center;
        padding: 18px;
        background: rgba(15, 23, 42, 0.54);
      }

      .result-backdrop.is-open {
        display: grid;
      }

      .result-dialog {
        width: min(440px, 100%);
        border: 1px solid #b9d9c7;
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 22px 56px rgba(15, 23, 42, 0.28);
        padding: 28px 22px 22px;
        text-align: center;
      }

      .result-mark {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        margin: 0 auto 16px;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        font-size: 34px;
        font-weight: 900;
      }

      .result-dialog h2 {
        margin: 0;
        font-size: 23px;
        letter-spacing: 0;
      }

      .result-dialog p {
        margin: 10px 0 20px;
        color: var(--muted);
        font-weight: 800;
        line-height: 1.6;
      }

      .result-dialog .button {
        width: 100%;
        min-height: 50px;
      }

      @media (max-width: 900px) {
        .form-grid {
          grid-template-columns: 1fr 1fr;
        }

        .schedule-row {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 560px) {
        .header {
          grid-template-columns: 1fr;
        }

        .header-actions {
          justify-content: space-between;
        }

        .user-chip {
          flex: 1 1 100%;
        }

        .form-grid,
        .hope-controls,
        .schedule-row {
          grid-template-columns: 1fr;
        }

        .tabs {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 4px;
        }

        .tabs button {
          min-width: 0;
          padding: 6px 3px;
          font-size: 12px;
        }

        .tools,
        .calendar {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .day {
          min-height: 0;
        }
      }
    </style>
  </head>
  <body>
    <section class="auth-shell" id="authView" aria-labelledby="authTitle">
      <div class="auth-frame">
        <header class="auth-brand">
          <h1 id="authTitle">シフト提出・希望確認</h1>
          <p>従業員IDで本人確認し、自分のシフト希望を提出・確認します。</p>
        </header>

        <div class="auth-panel">
          <div class="auth-tabs" role="tablist" aria-label="ログイン方法">
            <button type="button" class="is-active" id="loginTab" role="tab" aria-selected="true" aria-controls="loginPane" data-auth-pane="loginPane">ログイン</button>
            <button type="button" id="registerTab" role="tab" aria-selected="false" aria-controls="registerPane" data-auth-pane="registerPane">初めての方</button>
          </div>

          <section class="auth-pane is-active" id="loginPane" role="tabpanel" aria-labelledby="loginTab">
            <h2>ログイン</h2>
            <p>登録した従業員IDとパスワードを入力してください。</p>
            <form class="auth-form" id="loginForm" autocomplete="on">
              <label>
                従業員ID
                <input name="employeeId" id="loginEmployeeId" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
              </label>
              <label>
                パスワード
                <input name="password" id="loginPassword" type="password" autocomplete="current-password" required>
              </label>
              <button type="submit" class="button primary" id="loginButton">ログイン</button>
            </form>
            <p class="auth-message" id="loginMessage" role="status" aria-live="polite"></p>
          </section>

          <section class="auth-pane" id="registerPane" role="tabpanel" aria-labelledby="registerTab">
            <h2>初回登録</h2>
            <p>DB管理用スプレッドシートに登録済みの従業員IDを確認します。</p>
            <form class="auth-form" id="registrationLookupForm" autocomplete="off">
              <label>
                従業員ID
                <input name="employeeId" id="registerEmployeeId" type="text" autocapitalize="none" spellcheck="false" required>
              </label>
              <button type="submit" class="button primary" id="registrationLookupButton">従業員IDを確認</button>
            </form>

            <form class="auth-form is-hidden" id="registrationForm" autocomplete="on">
              <div class="employee-proof" aria-live="polite">
                <div class="employee-proof-body">
                  <span id="verifiedEmployeeId"></span>
                  <strong id="verifiedEmployeeName"></strong>
                </div>
              </div>
              <input name="employeeId" id="verifiedEmployeeIdInput" type="hidden">
              <label>
                パスワード
                <input name="password" id="registerPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
                <span class="password-rule">8文字以上72文字以内</span>
              </label>
              <label>
                パスワードを再入力
                <input name="passwordConfirm" id="registerPasswordConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
              </label>
              <button type="submit" class="button primary" id="registerButton">パスワードを登録</button>
              <button type="button" class="button" id="registrationBackButton">従業員IDを入力し直す</button>
            </form>
            <p class="auth-message" id="registerMessage" role="status" aria-live="polite"></p>
          </section>
        </div>
      </div>
    </section>

    <main class="app is-hidden" id="mainApp" tabindex="-1">
      <header class="header">
        <div>
          <h1>シフト提出・希望確認</h1>
          <p>シフト希望の提出、提出内容の確認、PT申請ができます。</p>
        </div>
        <div class="header-actions">
          <div class="user-chip" aria-label="ログイン中の従業員">
            <strong id="sessionName"></strong>
            <span id="sessionEmployeeId"></span>
          </div>
          <span class="status" id="connectionStatus">読込中</span>
          <button type="button" class="button account-button" id="passwordChangeButton">パスワード変更</button>
          <button type="button" class="button logout-button" id="logoutButton">ログアウト</button>
        </div>
      </header>

      <nav class="tabs" aria-label="表示切替">
        <button type="button" class="is-active" data-view="submitView">希望提出</button>
        <button type="button" data-view="hopeView">希望確認</button>
        <button type="button" data-view="ptView">PT申請</button>
      </nav>

      <section class="view is-active" id="submitView">
        <form id="shiftForm" autocomplete="on">
          <section class="panel">
            <div class="form-grid">
              <label>
                エリア
                <select name="areaId" id="areaSelect" required></select>
              </label>
              <label>
                店舗
                <select name="storeId" id="storeSelect" required></select>
              </label>
              <label>
                名前
                <select name="employeeId" id="employeeSelect" disabled required></select>
                <span class="field-note">ログインしている本人に固定</span>
              </label>
              <label>
                対象月
                <input name="month" id="monthInput" type="month" required>
              </label>
            </div>
          </section>

          <section class="panel month-nav">
            <button type="button" class="button" id="prevMonth">前月</button>
            <div class="month-title">
              <strong id="monthTitle"></strong>
              <small id="monthRange"></small>
            </div>
            <button type="button" class="button" id="nextMonth">翌月</button>
          </section>

          <section class="panel tools">
            <button type="button" class="button primary" data-fill="work">全日 勤務可能</button>
            <button type="button" class="button" data-fill="holiday">全日 休み希望</button>
            <button type="button" class="button danger" data-fill="clear">全日 未入力</button>
          </section>

          <section class="calendar" id="calendarGrid"></section>

          <section class="panel">
            <label>
              備考
              <textarea name="notes" rows="3" placeholder="固定休、早上がり、相談したい日など"></textarea>
            </label>
          </section>

          <section class="panel actions">
            <button type="submit" class="button primary">シフト希望を提出</button>
            <button type="reset" class="button danger">入力をクリア</button>
            <p class="message" id="message" role="status"></p>
          </section>
        </form>
      </section>

      <section class="view" id="hopeView">
        <section class="panel">

      const state = {

      const elements = {

        mainApp: document.querySelector("#mainApp"),
        loginForm: document.querySelector("#loginForm"),
        loginEmployeeId: document.querySelector("#loginEmployeeId"),
        loginPassword: document.querySelector("#loginPassword"),

        loginMessage: document.querySelector("#loginMessage"),

        registrationLookupButton: document.querySelector("#registrationLookupButton"),

        registerPasswordConfirm: document.querySelector("#registerPasswordConfirm"),
        registerButton: document.querySelector("#registerButton"),
        registrationBackButton: document.querySelector("#registrationBackButton"),
        registerMessage: document.querySelector("#registerMessage"),
        sessionName: document.querySelector("#sessionName"),
        sessionEmployeeId: document.querySelector("#sessionEmployeeId"),
        passwordChangeButton: document.querySelector("#passwordChangeButton"),
        passwordDialog: document.querySelector("#passwordDialog"),
        passwordChangeForm: document.querySelector("#passwordChangeForm"),
        currentPassword: document.querySelector("#currentPassword"),
        newPassword: document.querySelector("#newPassword"),
        newPasswordConfirm: document.querySelector("#newPasswordConfirm"),
        passwordChangeMessage: document.querySelector("#passwordChangeMessage"),
        passwordChangeCancel: document.querySelector("#passwordChangeCancel"),
        passwordChangeSubmit: document.querySelector("#passwordChangeSubmit"),
        logoutButton: document.querySelector("#logoutButton"),
        status: document.querySelector("#connectionStatus"),
        shiftForm: document.querySelector("#shiftForm"),

        store: document.querySelector("#storeSelect"),

        monthRange: document.querySelector("#monthRange"),

        hopeMonth: document.querySelector("#hopeMonthInput"),
        hopeMessage: document.querySelector("#hopeMessage"),
        hopeList: document.querySelector("#hopeList"),
        ptForm: document.querySelector("#ptForm"),
        ptArea: document.querySelector("#ptAreaSelect"),
        ptStore: document.querySelector("#ptStoreSelect"),
        ptEmployee: document.querySelector("#ptEmployeeSelect"),
        ptStart: document.querySelector("#ptStart"),
        ptEnd: document.querySelector("#ptEnd"),
        ptMessage: document.querySelector("#ptMessage"),
        confirmDialog: document.querySelector("#confirmDialog"),
        confirmTitle: document.querySelector("#confirmTitle"),
        confirmBody: document.querySelector("#confirmBody"),
        confirmOk: document.querySelector("#confirmOk"),
        confirmCancel: document.querySelector("#confirmCancel"),

        resultTitle: document.querySelector("#resultTitle"),
        resultBody: document.querySelector("#resultBody"),
        resultClose: document.querySelector("#resultClose"),
      };
      let pendingConfirmAction = null;
      let suppressNextResetConfirm = false;
      let passwordChangePending = false;

      function setMessage(node, text, type = "") {
        node.textContent = text;
        node.className = `message ${type}`.trim();
      }

      function setAuthMessage(node, text, type = "") {
        node.textContent = text;
        node.className = `auth-message ${type}`.trim();
      }

      function setButtonBusy(button, busy, busyLabel = "処理中...") {
        if (busy) {
          button.dataset.defaultLabel = button.textContent;
          button.textContent = busyLabel;
          button.disabled = true;
          return;
        }
        button.textContent = button.dataset.defaultLabel || button.textContent;
        button.disabled = false;
        delete button.dataset.defaultLabel;
      }

      function switchAuthPane(paneId) {
        document.querySelectorAll("[data-auth-pane]").forEach((button) => {
          const active = button.dataset.authPane === paneId;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-selected", String(active));
        });
        document.querySelectorAll(".auth-pane").forEach((pane) => {
          pane.classList.toggle("is-active", pane.id === paneId);
        });
        window.setTimeout(() => {
          const target = paneId === "loginPane" ? elements.loginEmployeeId : elements.registerEmployeeId;
          target.focus();
        }, 0);
      }

      function resetRegistrationVerification() {
        state.verifiedEmployee = null;
        elements.registrationForm.reset();
        elements.registrationForm.classList.add("is-hidden");
        elements.registrationLookupForm.classList.remove("is-hidden");
        elements.verifiedEmployeeId.textContent = "";
        elements.verifiedEmployeeName.textContent = "";
        elements.verifiedEmployeeIdInput.value = "";
        setAuthMessage(elements.registerMessage, "");
        elements.registerEmployeeId.focus();
      }

      function showAuthenticatedApp(result) {
        if (!result || !result.ok || !result.session || !result.session.authToken || !result.initialData) {
          throw new Error("ログイン情報の形式を確認できません。もう一度お試しください。");
        }

        state.session = result.session;
        state.authToken = result.session.authToken;
        try {
          applyInitialData(result.initialData);
        } catch (error) {
          state.session = null;
          state.authToken = "";
          throw error;
        }
        sessionStorage.setItem(authStorageKey, JSON.stringify({ authToken: state.authToken }));
        elements.sessionName.textContent = state.session.name;
        elements.sessionEmployeeId.textContent = state.session.employeeId;
        elements.authView.classList.add("is-hidden");
        elements.mainApp.classList.remove("is-hidden");
        elements.loginForm.reset();
        setAuthMessage(elements.loginMessage, "");
        elements.mainApp.focus({ preventScroll: true });
        console.log("[showAuthenticatedApp] 本人画面を表示", { employeeId: state.session.employeeId });
      }

      function clearAuthenticatedApp(message = "ログアウトしました。") {
        sessionStorage.removeItem(authStorageKey);
        state.session = null;
        state.authToken = "";
        state.areas = [];
        state.stores = [];
        state.staff = [];
        state.staffStoreSettings = [];
        elements.mainApp.classList.add("is-hidden");
        elements.authView.classList.remove("is-hidden");
        elements.hopeList.innerHTML = "";
        switchAuthPane("loginPane");
        setAuthMessage(elements.loginMessage, message, "success");
      }

      function submitLogin(event) {
        event.preventDefault();
        if (!hasGoogleRunner()) {
          setAuthMessage(elements.loginMessage, "GASのウェブアプリURLから開いてください。", "error");
          return;
        }

        const employeeId = elements.loginEmployeeId.value.trim();
        const password = elements.loginPassword.value;
        if (!employeeId || !password) {
          setAuthMessage(elements.loginMessage, "従業員IDとパスワードを入力してください。", "error");
          return;
        }

        console.log("[submitLogin] ログイン開始", { employeeId });
        setAuthMessage(elements.loginMessage, "ログイン情報を確認しています...");
        setButtonBusy(elements.loginButton, true, "確認中...");
        google.script.run
          .withSuccessHandler((result) => {
            setButtonBusy(elements.loginButton, false);
            try {
              showAuthenticatedApp(result);
            } catch (error) {
              console.error("[submitLogin] 応答処理に失敗", error);
              setAuthMessage(elements.loginMessage, error.message, "error");
            }
          })
          .withFailureHandler((error) => {
            console.error("[submitLogin] ログイン失敗", error);
            setButtonBusy(elements.loginButton, false);
            setAuthMessage(elements.loginMessage, error.message || "ログインできませんでした。入力内容を確認してください。", "error");
          })
          .login({ employeeId, password });
      }

      function lookupRegistrationEmployee(event) {
        event.preventDefault();
        if (!hasGoogleRunner()) {
          setAuthMessage(elements.registerMessage, "GASのウェブアプリURLから開いてください。", "error");
          return;
        }

        const employeeId = elements.registerEmployeeId.value.trim();
        if (!employeeId) {
          setAuthMessage(elements.registerMessage, "従業員IDを入力してください。", "error");
          return;
        }

        console.log("[lookupRegistrationEmployee] 従業員ID確認開始", { employeeId });
        setAuthMessage(elements.registerMessage, "従業員マスタを確認しています...");
        setButtonBusy(elements.registrationLookupButton, true, "確認中...");
        google.script.run
          .withSuccessHandler((result) => {
            setButtonBusy(elements.registrationLookupButton, false);
            if (!result || !result.employee) {
              setAuthMessage(elements.registerMessage, "従業員情報を確認できませんでした。", "error");
              return;
            }
            state.verifiedEmployee = result.employee;
            elements.verifiedEmployeeId.textContent = result.employee.employeeId;
            elements.verifiedEmployeeName.textContent = result.employee.name;
            elements.verifiedEmployeeIdInput.value = result.employee.employeeId;
            elements.registrationLookupForm.classList.add("is-hidden");
            elements.registrationForm.classList.remove("is-hidden");
            setAuthMessage(elements.registerMessage, "本人情報を確認できました。パスワードを登録してください。", "success");
            elements.registerPassword.focus();
          })
          .withFailureHandler((error) => {
            console.error("[lookupRegistrationEmployee] 確認失敗", error);
            setButtonBusy(elements.registrationLookupButton, false);
            setAuthMessage(elements.registerMessage, error.message || "従業員IDを確認できませんでした。", "error");
          })
          .lookupEmployeeForRegistration({ employeeId });
      }

      function submitRegistration(event) {
        event.preventDefault();
        if (!state.verifiedEmployee) {
          resetRegistrationVerification();
          setAuthMessage(elements.registerMessage, "先に従業員IDを確認してください。", "error");
          return;
        }

        const password = elements.registerPassword.value;
        const passwordConfirm = elements.registerPasswordConfirm.value;
        if (password.length < 8) {
          setAuthMessage(elements.registerMessage, "パスワードは8文字以上で入力してください。", "error");
          return;
        }
        if (password !== passwordConfirm) {
          setAuthMessage(elements.registerMessage, "確認用パスワードが一致しません。もう一度入力してください。", "error");
          elements.registerPasswordConfirm.focus();
          return;
        }

        console.log("[submitRegistration] 初回登録開始", { employeeId: state.verifiedEmployee.employeeId });
        setAuthMessage(elements.registerMessage, "パスワードを登録しています...");
        setButtonBusy(elements.registerButton, true, "登録中...");
        google.script.run
          .withSuccessHandler((result) => {
            setButtonBusy(elements.registerButton, false);
            try {
              resetRegistrationVerification();
              showAuthenticatedApp(result);
            } catch (error) {
              console.error("[submitRegistration] 応答処理に失敗", error);
              setAuthMessage(elements.registerMessage, error.message, "error");
            }
          })
          .withFailureHandler((error) => {
            console.error("[submitRegistration] 登録失敗", error);
            setButtonBusy(elements.registerButton, false);
            setAuthMessage(elements.registerMessage, error.message || "パスワードを登録できませんでした。", "error");
          })
          .registerAccount({
            employeeId: state.verifiedEmployee.employeeId,
            password,
            passwordConfirm,
          });
      }

      function restoreAuthenticatedSession() {
        if (!hasGoogleRunner()) {
          setAuthMessage(elements.loginMessage, "GASのウェブアプリURLから開いてください。", "error");
          return;
        }

        let saved = null;
        try {
          saved = JSON.parse(sessionStorage.getItem(authStorageKey) || "null");
        } catch (error) {
          sessionStorage.removeItem(authStorageKey);
        }
        if (!saved || !saved.authToken) {
          elements.loginEmployeeId.focus();
          return;
        }

        setAuthMessage(elements.loginMessage, "ログイン状態を確認しています...");
        google.script.run
          .withSuccessHandler((result) => {
            try {
              showAuthenticatedApp(result);
            } catch (error) {
              sessionStorage.removeItem(authStorageKey);
              setAuthMessage(elements.loginMessage, error.message, "error");
            }
          })
          .withFailureHandler((error) => {
            console.warn("[restoreAuthenticatedSession] セッション復元失敗", error);
            sessionStorage.removeItem(authStorageKey);
            setAuthMessage(elements.loginMessage, error.message || "ログインの有効期限が切れました。もう一度ログインしてください。", "error");
            elements.loginEmployeeId.focus();
          })
          .getSessionData(saved.authToken);
      }

      function logoutCurrentUser() {
        const authToken = state.authToken;
        elements.logoutButton.disabled = true;
        if (!hasGoogleRunner() || !authToken) {
          clearAuthenticatedApp();
          elements.logoutButton.disabled = false;
          return;
        }
        google.script.run
          .withSuccessHandler(() => {
            elements.logoutButton.disabled = false;
            clearAuthenticatedApp();
          })
          .withFailureHandler((error) => {
            console.warn("[logoutCurrentUser] サーバー側ログアウト失敗", error);
            elements.logoutButton.disabled = false;
            clearAuthenticatedApp("端末上のログイン情報を消去しました。");
          })
          .logout(authToken);

      function openPasswordDialog() {
        elements.passwordChangeForm.reset();
        setMessage(elements.passwordChangeMessage, "");
        elements.passwordDialog.classList.add("is-open");
        window.setTimeout(() => elements.currentPassword.focus(), 0);

      function closePasswordDialog() {
        if (passwordChangePending) return;
        elements.passwordDialog.classList.remove("is-open");
        elements.passwordChangeForm.reset();
        setMessage(elements.passwordChangeMessage, "");
        setButtonBusy(elements.passwordChangeSubmit, false);

      function setPasswordChangeBusy(busy) {
        passwordChangePending = busy;
        elements.passwordChangeForm.setAttribute("aria-busy", String(busy));
        elements.passwordChangeCancel.disabled = busy;
        setButtonBusy(elements.passwordChangeSubmit, busy, "変更中...");

      function submitPasswordChange(event) {
        event.preventDefault();
        const currentPassword = elements.currentPassword.value;
        const newPassword = elements.newPassword.value;
        const passwordConfirm = elements.newPasswordConfirm.value;

        if (!currentPassword) {
          setMessage(elements.passwordChangeMessage, "現在のパスワードを入力してください。", "error");
          elements.currentPassword.focus();
          return;
        }
        if (newPassword.length < 8 || newPassword.length > 72) {
          setMessage(elements.passwordChangeMessage, "新しいパスワードは8文字以上72文字以内で入力してください。", "error");
          elements.newPassword.focus();
          return;
        }
        if (newPassword !== passwordConfirm) {
          setMessage(elements.passwordChangeMessage, "新しいパスワードの再入力が一致しません。", "error");
          elements.newPasswordConfirm.focus();
          return;
        }
        if (currentPassword === newPassword) {
          setMessage(elements.passwordChangeMessage, "現在とは異なるパスワードを入力してください。", "error");
          elements.newPassword.focus();
          return;
        }
        if (!hasGoogleRunner()) {
          setMessage(elements.passwordChangeMessage, "GASのウェブアプリURLから変更してください。", "error");
          return;
        }

        console.log("[submitPasswordChange] パスワード変更開始", { employeeId: state.session && state.session.employeeId });
        setMessage(elements.passwordChangeMessage, "パスワードを変更しています...");
        setPasswordChangeBusy(true);
        google.script.run
          .withSuccessHandler((result) => {
            setPasswordChangeBusy(false);
            if (!result || !result.ok || !result.session || !result.session.authToken) {
              setMessage(elements.passwordChangeMessage, "変更後のログイン情報を確認できませんでした。もう一度お試しください。", "error");
              return;
            }
            state.session = { ...state.session, ...result.session };
            state.authToken = result.session.authToken;
            sessionStorage.setItem(authStorageKey, JSON.stringify({ authToken: state.authToken }));
            closePasswordDialog();
            showResultDialog("パスワードを変更しました", "次回から新しいパスワードでログインしてください。");
            console.log("[submitPasswordChange] パスワード変更完了", { employeeId: state.session.employeeId });
          })
          .withFailureHandler((error) => {
            console.error("[submitPasswordChange] パスワード変更失敗", error);
            setPasswordChangeBusy(false);
            const message = error && error.message ? error.message : "パスワードを変更できませんでした。";
            if (/ログイン|セッション|有効期限/.test(message)) {
              closePasswordDialog();
              clearAuthenticatedApp(message);
              return;
            }
            setMessage(elements.passwordChangeMessage, message, "error");
          })
          .changePassword({
            authToken: state.authToken,
            currentPassword,
            newPassword,
            passwordConfirm,
          });
      }

        elements.resultTitle.textContent = title;
        elements.resultBody.textContent = body;

        elements.resultDialog.classList.remove("is-open");

      function handleAuthenticatedFailure(error, messageNode, fallbackMessage) {
        const message = error && error.message ? error.message : fallbackMessage;
        if (/ログイン|セッション|有効期限/.test(message)) {
          clearAuthenticatedApp(message);
          return;
        }
        setMessage(messageNode, message, "error");

      function openConfirm({ title, body, confirmLabel = "確定", danger = false, onConfirm }) {
        pendingConfirmAction = onConfirm;
        elements.confirmTitle.textContent = title;
        elements.confirmBody.textContent = body;
        elements.confirmOk.textContent = confirmLabel;
        elements.confirmOk.className = `button ${danger ? "danger" : "primary"}`;
        elements.confirmDialog.classList.add("is-open");
        elements.confirmCancel.focus();
      }

      function closeConfirm() {
        elements.confirmDialog.classList.remove("is-open");
        pendingConfirmAction = null;
      }

      function getDefaultMonth() {
        const today = new Date();
        return toMonthValue(new Date(today.getFullYear(), today.getMonth() + 1, 1));
      }

      function toMonthValue(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
      }

      function parseMonth(value) {
        if (!value) return parseMonth(getDefaultMonth());
        const [year, month] = value.split("-").map(Number);
        if (!year || !month) return parseMonth(getDefaultMonth());
        return new Date(year, month - 1, 1);
      }

      function daysInMonth(value) {
        const date = parseMonth(value);
        return new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
      }

      function timeToMinutes(value) {
        const match = String(value || "").match(/^(\d{1,2}):(\d{2})$/);
        if (!match) return null;
        const hour = Number(match[1]);
        const minute = Number(match[2]);
        if (hour > 24 || minute > 59 || (hour === 24 && minute !== 0)) return null;
        return hour * 60 + minute;
      }

      function normalizeTimeValue(value) {
        const minutes = timeToMinutes(value);
        if (minutes === null) return "";
        const hour = Math.floor(minutes / 60);
        const minute = minutes % 60;
        return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
      }

      function isTimeWithinRange(value, minTime, maxTime) {
        const minutes = timeToMinutes(value);
        const minMinutes = timeToMinutes(minTime);
        const maxMinutes = timeToMinutes(maxTime);
        return minutes !== null && minutes >= minMinutes && minutes <= maxMinutes;
      }

      function buildHourOptions(select, firstLabel = "選択", minTime = WORK_MIN_TIME, maxTime = WORK_MAX_TIME, selectedValue = "") {
        select.innerHTML = `<option value="">${firstLabel}</option>`;
        const minHour = Math.floor(timeToMinutes(minTime) / 60);
        const maxHour = Math.floor(timeToMinutes(maxTime) / 60);
        for (let hour = minHour; hour <= maxHour; hour++) {
          const option = document.createElement("option");
          option.value = `${String(hour).padStart(2, "0")}:00`;
          option.textContent = `${hour}:00`;
          select.append(option);
        }
        const normalized = normalizeTimeValue(selectedValue);
        if (normalized && [...select.options].some((option) => option.value === normalized)) {
          select.value = normalized;
        }
      }

      function getShiftTimeRange(type) {
        if (type === "勤務可能") {
          return { min: WORK_MIN_TIME, max: WORK_MAX_TIME, label: "勤務可能" };
        }
        if (type === "PT") {
          return { min: PT_MIN_TIME, max: PT_MAX_TIME, label: "PT" };
        }
        return null;
      }

      function configureTimeOptions(card, preferredStart = "", preferredEnd = "") {
        const type = card.querySelector('[name="type"]').value;
        const start = card.querySelector('[name="start"]');
        const end = card.querySelector('[name="end"]');
        const range = getShiftTimeRange(type);
        if (!range) {
          start.innerHTML = '<option value="">開始</option>';
          end.innerHTML = '<option value="">終了</option>';
          return;
        }

        const startValue = isTimeWithinRange(preferredStart, range.min, range.max) ? preferredStart : DEFAULT_START;
        const endValue = isTimeWithinRange(preferredEnd, range.min, range.max) ? preferredEnd : DEFAULT_END;
        buildHourOptions(start, "開始", range.min, range.max, startValue);
        buildHourOptions(end, "終了", range.min, range.max, endValue);
      }

      function validateTimeWindow(startValue, endValue, minTime, maxTime, label, date = "") {
        const context = `${date ? `${date}の` : ""}${label}`;
        const start = timeToMinutes(startValue);
        const end = timeToMinutes(endValue);
        const min = timeToMinutes(minTime);
        const max = timeToMinutes(maxTime);
        if (start === null || end === null) {
          return `${context}は開始時間と終了時間を選択してください。`;
        }
        if (start < min || start > max || end < min || end > max) {
          return `${context}は${minTime}〜${maxTime}の範囲で指定してください。`;
        }
        if (start >= end) {
          return `${context}の開始時間は終了時間より前にしてください。`;
        }
        return "";
      }

      function findShiftTimeIssue(shifts) {
        for (const shift of shifts) {
          const range = getShiftTimeRange(shift.type);
          if (!range) continue;
          const message = validateTimeWindow(shift.start, shift.end, range.min, range.max, range.label, shift.date);
          if (message) return { date: shift.date, message };
        }
        return null;
      }

      function focusShiftTimeIssue(issue) {
        elements.calendar.querySelectorAll(".day.has-error").forEach((card) => card.classList.remove("has-error"));
        const card = elements.calendar.querySelector(`[data-date="${issue.date}"]`);
        if (!card) return;
        card.classList.add("has-error");
        card.scrollIntoView({ behavior: "smooth", block: "center" });
        window.setTimeout(() => card.querySelector('[name="start"]').focus(), 250);
      }

      function fillSelect(select, options, placeholder, valueKey, labelKey) {
        select.innerHTML = `<option value="">${placeholder}</option>`;
        options.forEach((item) => {
          const option = document.createElement("option");
          option.value = item[valueKey];
          option.textContent = item[labelKey];
          select.append(option);
        });
      }

      function storesByArea(areaId) {
        return state.stores.filter((store) => store.areaId === areaId);
      }

      function employeesByStore(storeId, help = false) {
        const employeeIds = state.staffStoreSettings
          .filter((setting) => setting.storeId === storeId && (help ? setting.helpCandidate : setting.normalDisplay))
          .map((setting) => setting.employeeId);
        return state.staff.filter((staff) => employeeIds.includes(staff.employeeId));
      }

      function syncStoreOptions(areaSelect, storeSelect, employeeSelect, help = false) {
        // エリア選択に応じて店舗候補を更新し、続けて名前候補も更新する。
        console.log("[syncStoreOptions] 店舗候補更新", { areaId: areaSelect.value, help });
        const stores = storesByArea(areaSelect.value);
        fillSelect(storeSelect, stores, "店舗を選択", "storeId", "storeName");
        if (stores.length) {
          storeSelect.value = stores[0].storeId;
        }
        syncEmployeeOptions(storeSelect, employeeSelect, help);
      }

      function syncEmployeeOptions(storeSelect, employeeSelect, help = false) {
        // 店舗選択に応じて、通常表示またはヘルプ候補の従業員だけを表示する。
        console.log("[syncEmployeeOptions] 名前候補更新", { storeId: storeSelect.value, help });
        if (state.session) {
          const current = state.staff.find((staff) => staff.employeeId === state.session.employeeId) || state.session;
          fillSelect(employeeSelect, [current], "ログイン本人", "employeeId", "name");
          employeeSelect.value = state.session.employeeId;
          employeeSelect.disabled = true;
          return;
        }
        const employees = employeesByStore(storeSelect.value, help);
        fillSelect(employeeSelect, employees, "名前を選択", "employeeId", "name");
        if (employees.length) {
          employeeSelect.value = employees[0].employeeId;
        }
      }

      function setLocationDefaults(areaSelect, storeSelect, employeeSelect, areaId, storeId, help = false) {
        const defaultAreaId = state.areas.some((area) => area.areaId === areaId)
          ? areaId
          : (state.areas[0] ? state.areas[0].areaId : "");
        areaSelect.value = defaultAreaId;
        syncStoreOptions(areaSelect, storeSelect, employeeSelect, help);
        if (storesByArea(defaultAreaId).some((store) => store.storeId === storeId)) {
          storeSelect.value = storeId;
        }
        syncEmployeeOptions(storeSelect, employeeSelect, help);
      }

      function updateMonthHeader() {
        if (!elements.month.value) {
          elements.month.value = getDefaultMonth();
        }
        const month = parseMonth(elements.month.value);
        const monthNumber = month.getMonth() + 1;
        const lastDay = daysInMonth(elements.month.value);
        elements.monthTitle.textContent = `${month.getFullYear()}/${String(monthNumber).padStart(2, "0")}/01 - ${String(monthNumber).padStart(2, "0")}/${lastDay}`;
        elements.monthRange.textContent = `通常シフト提出期限: 毎月${DEADLINE_DAY}日`;
      }

      function renderCalendar(existing = {}) {
        // 対象月の日数に合わせて、1か月分の入力カードを描画する。
        console.log("[renderCalendar] カレンダー描画開始", { month: elements.month.value, existing: Object.keys(existing).length });
        if (!elements.month.value) {
          elements.month.value = getDefaultMonth();
        }
        elements.calendar.innerHTML = "";
        const monthValue = elements.month.value;
        const date = parseMonth(monthValue);
        const year = date.getFullYear();
        const month = date.getMonth();
        const totalDays = daysInMonth(monthValue);

        for (let day = 1; day <= totalDays; day++) {
          const current = new Date(year, month, day);
          const dateValue = `${monthValue}-${String(day).padStart(2, "0")}`;
          const saved = existing[dateValue] || {};
          const card = elements.dayTemplate.content.firstElementChild.cloneNode(true);
          const weekday = current.getDay();
          card.dataset.date = dateValue;
          if (weekday === 0) card.classList.add("sunday");
          if (weekday === 6) card.classList.add("saturday");
          card.querySelector(".date-main").innerHTML = `<span class="month">${month + 1}/</span><span class="day-number">${day}</span>`;
          card.querySelector(".weekday").textContent = weekdays[weekday];

          const type = card.querySelector('[name="type"]');
          const start = card.querySelector('[name="start"]');
          const end = card.querySelector('[name="end"]');
          type.value = saved.type || "未入力";
          configureTimeOptions(card, saved.start || "", saved.end || "");
          refreshTimeVisibility(card);

          type.addEventListener("input", () => {
            const previousStart = start.value;
            const previousEnd = end.value;
            configureTimeOptions(card, previousStart, previousEnd);
            card.classList.remove("has-error");
            refreshTimeVisibility(card);
            saveDraft();
          });
          start.addEventListener("input", () => {
            card.classList.remove("has-error");
            saveDraft();
          });
          end.addEventListener("input", () => {
            card.classList.remove("has-error");
            saveDraft();
          });
          elements.calendar.append(card);
        }
        updateMonthHeader();
        console.log("[renderCalendar] カレンダー描画完了", { days: totalDays });
      }

      function refreshTimeVisibility(card) {
        const type = card.querySelector('[name="type"]').value;
        card.querySelector(".time-row").classList.toggle("is-hidden", !["勤務可能", "PT"].includes(type));
      }

      function collectPayload() {
        const formData = new FormData(elements.shiftForm);
        const employee = state.session;
        const shifts = [...elements.calendar.querySelectorAll(".day")].map((card) => ({
          date: card.dataset.date,
          type: card.querySelector('[name="type"]').value,
          start: card.querySelector('[name="start"]').value,
          end: card.querySelector('[name="end"]').value,
        }));
        return {
          areaId: formData.get("areaId"),
          storeId: formData.get("storeId"),
          employeeId: employee ? employee.employeeId : "",
          name: employee ? employee.name : "",
          authToken: state.authToken,
          month: formData.get("month"),
          notes: formData.get("notes").trim(),
          shifts,
        };
      }

      function groupShiftsByDate(shifts = []) {
        return Object.fromEntries(shifts.map((shift) => [shift.date, shift]));
      }

      function getDraftStorageKey() {
        return state.session ? `${storageKey}:${state.session.employeeId}` : storageKey;
      }

      function saveDraft() {
        // 入力中の内容をブラウザのローカルストレージに保存する。
        if (!state.session || !elements.calendar.children.length) return;
        console.log("[saveDraft] 下書き保存");
        localStorage.setItem(getDraftStorageKey(), JSON.stringify(collectPayload()));
      }

      function restoreDraft() {
        // ローカルストレージから下書きを復元する。
        console.log("[restoreDraft] 下書き復元開始");
        const saved = localStorage.getItem(getDraftStorageKey());
        if (!saved) {
          renderCalendar();
          console.log("[restoreDraft] 下書きなし");
          return;
        }
        let data = null;
        try {
          data = JSON.parse(saved);
        } catch (error) {
          localStorage.removeItem(getDraftStorageKey());
          renderCalendar();
          console.warn("[restoreDraft] 保存データが壊れていたため削除", error);
          return;
        }
        const hasSavedArea = state.areas.some((area) => area.areaId === data.areaId);
        elements.area.value = hasSavedArea ? data.areaId : elements.area.value;
        syncStoreOptions(elements.area, elements.store, elements.employee);
        const hasSavedStore = storesByArea(elements.area.value).some((store) => store.storeId === data.storeId);
        if (hasSavedStore) elements.store.value = data.storeId;
        syncEmployeeOptions(elements.store, elements.employee);
        elements.month.value = data.month || elements.month.value || getDefaultMonth();
        elements.shiftForm.elements.notes.value = data.notes || "";
        renderCalendar(groupShiftsByDate(data.shifts));
        console.log("[restoreDraft] 下書き復元完了", { month: elements.month.value });
      }

      function moveMonth(amount) {
        const current = parseMonth(elements.month.value);
        current.setMonth(current.getMonth() + amount);
        elements.month.value = toMonthValue(current);
        renderCalendar(groupShiftsByDate(collectPayload().shifts));
        saveDraft();
      }

      function fillAll(mode) {
        // 1か月分のカードへ一括入力する。
        console.log("[fillAll] 一括入力", { mode });
        elements.calendar.querySelectorAll(".day").forEach((card) => {
          const type = card.querySelector('[name="type"]');
          const start = card.querySelector('[name="start"]');
          const end = card.querySelector('[name="end"]');
          if (mode === "work") {
            type.value = "勤務可能";
          }
          if (mode === "holiday") {
            type.value = "休み希望";
          }
          if (mode === "clear") {
            type.value = "未入力";
          }
          configureTimeOptions(card, start.value, end.value);
          card.classList.remove("has-error");
          refreshTimeVisibility(card);
        });
        saveDraft();
      }

      function submitShift(event) {
        // 月間シフト希望をGASへ送信する。
        event.preventDefault();
        const payload = collectPayload();
        console.log("[submitShift] 提出開始", {
          employeeId: payload.employeeId,
          areaId: payload.areaId,
          storeId: payload.storeId,
          month: payload.month,
        });
        const requested = payload.shifts.filter((shift) => shift.type !== "未入力");
        if (!payload.areaId || !payload.storeId || !payload.month) {
          setMessage(elements.message, "エリア、店舗、対象月を選択してください。", "error");
          return;
        }
        if (!requested.length) {
          setMessage(elements.message, "勤務可能・休み希望・有給希望・PTのどれかを1日以上入力してください。", "error");
          return;
        }
        const timeIssue = findShiftTimeIssue(requested);
        if (timeIssue) {
          setMessage(elements.message, timeIssue.message, "error");
          focusShiftTimeIssue(timeIssue);
          return;
        }
        openConfirm({
          title: "シフト希望を提出しますか",
          body: "入力した1か月分のシフト希望を送信します。送信後も再提出すると内容を更新できます。",
          confirmLabel: "提出する",
          onConfirm: () => executeSubmitShift(payload),
        });
      }

      function executeSubmitShift(payload) {
        if (!hasGoogleRunner()) {
          setMessage(elements.message, "GAS上で開くと送信できます。現在は画面確認モードです。", "error");
          console.log("[executeSubmitShift] GASランナーなし");
          return;
        }
        console.log("[executeSubmitShift] 提出確定", {
          employeeId: payload.employeeId,
          areaId: payload.areaId,
          storeId: payload.storeId,
          month: payload.month,
        });
        setMessage(elements.message, "送信中です...");
        const submitButton = elements.shiftForm.querySelector('[type="submit"]');
        setButtonBusy(submitButton, true, "送信中...");
        google.script.run
          .withSuccessHandler((result) => {
            console.log("[executeSubmitShift] 提出成功", result);
            localStorage.setItem(getDraftStorageKey(), JSON.stringify(payload));
            const title = result.updated ? "シフト希望を更新しました" : "シフト希望を提出しました";
            const body = `${state.session.name}さんの${payload.month}分を保存しました。希望確認から提出内容を確認できます。`;
            setMessage(elements.message, title, "success");
            showResultDialog(title, body);
            setButtonBusy(submitButton, false);
          })
          .withFailureHandler((error) => {
            console.error("[executeSubmitShift] 提出失敗", error);
            setButtonBusy(submitButton, false);
            handleAuthenticatedFailure(error, elements.message, "送信に失敗しました。入力内容を確認してください。");
          })
          .submitShift(payload);
      }

      function confirmClearShift(event) {
        if (suppressNextResetConfirm) {
          suppressNextResetConfirm = false;
          return;
        }
        event.preventDefault();
        openConfirm({
          title: "入力内容をクリアしますか",
          body: "現在入力しているシフト希望と備考をすべて消します。下書きも削除されます。",
          confirmLabel: "クリアする",
          danger: true,
          onConfirm: executeClearShift,
        });
      }

      function executeClearShift() {
        localStorage.removeItem(getDraftStorageKey());
        suppressNextResetConfirm = true;
        elements.shiftForm.reset();
        elements.month.value = getDefaultMonth();
        renderCalendar();
        setMessage(elements.message, "入力内容をクリアしました。");
        console.log("[executeClearShift] 入力クリア完了");
      }

      function submitPt(event) {
        // PT申請をGASへ送信する。
        event.preventDefault();
        const formData = new FormData(elements.ptForm);
        const employee = state.session;
        const payload = {
          kind: "pt",
          employeeId: employee ? employee.employeeId : "",
          name: employee ? employee.name : "",
          authToken: state.authToken,
          workAreaId: formData.get("areaId"),
          workStoreId: formData.get("storeId"),
          date: formData.get("date"),
          start: formData.get("start"),
          end: formData.get("end"),
          notes: formData.get("notes"),
        };
        const timeError = validateTimeWindow(payload.start, payload.end, PT_MIN_TIME, PT_MAX_TIME, "PT", payload.date);
        if (timeError) {
          setMessage(elements.ptMessage, timeError, "error");
          elements.ptStart.focus();
          return;
        }
        if (!hasGoogleRunner()) {
          setMessage(elements.ptMessage, "GAS上で開くとPT申請できます。現在は画面確認モードです。", "error");
          console.log("[submitPt] GASランナーなし");
          return;
        }
        console.log("[submitPt] PT申請開始", payload);
        setMessage(elements.ptMessage, "PT申請を送信中です...");
        const submitButton = elements.ptForm.querySelector('[type="submit"]');
        setButtonBusy(submitButton, true, "送信中...");
        google.script.run
          .withSuccessHandler((result) => {
            console.log("[submitPt] PT申請成功", result);
            setButtonBusy(submitButton, false);
            setMessage(elements.ptMessage, "PT申請を受け付けました。", "success");
            showResultDialog("PT申請を受け付けました", `${state.session.name}さんのPT申請を保存しました。希望確認から内容を確認できます。`);
          })
          .withFailureHandler((error) => {
            console.error("[submitPt] PT申請失敗", error);
            setButtonBusy(submitButton, false);
            handleAuthenticatedFailure(error, elements.ptMessage, "PT申請に失敗しました。入力内容を確認してください。");
          })
          .submitPtRequest(payload);
      }

      function loadHopes() {
        // ログイン中の従業員が提出した希望だけをGASから取得する。
        if (!hasGoogleRunner()) {
          setMessage(elements.hopeMessage, "GAS上で開くと提出済み希望を取得できます。現在は画面確認モードです。", "error");
          console.log("[loadHopes] GASランナーなし");
          return;
        }
        const employee = state.session;
        if (!employee || !elements.hopeMonth.value) {
          setMessage(elements.hopeMessage, "対象月を選択してください。", "error");
          return;
        }
        console.log("[loadHopes] 希望取得開始", { employeeId: employee.employeeId, month: elements.hopeMonth.value });
        setMessage(elements.hopeMessage, "読込中です...");
        elements.hopeList.innerHTML = "";
        const loadButton = document.querySelector("#loadHopes");
        setButtonBusy(loadButton, true, "読込中...");
        google.script.run
          .withSuccessHandler((result) => {
            setButtonBusy(loadButton, false);
            renderHopes(result);
          })
          .withFailureHandler((error) => {
            console.error("[loadHopes] 希望取得失敗", error);
            setButtonBusy(loadButton, false);
            handleAuthenticatedFailure(error, elements.hopeMessage, "読込に失敗しました。もう一度お試しください。");
          })
          .getMyShiftHopes({ authToken: state.authToken, month: elements.hopeMonth.value });
      }

      function renderHopes(data) {
        // 月間希望と随時提出したPT申請を、日付順に一覧表示する。
        if (!data || data.ok === false) {
          console.error("[renderHopes] 不正なレスポンス", data);
          setMessage(elements.hopeMessage, (data && data.error) || "希望データの形式が不正です。", "error");
          elements.hopeList.innerHTML = "";
          return;
        }
        const hopes = Array.isArray(data.hopes) ? data.hopes : [];
        const ptRequests = Array.isArray(data.ptRequests) ? data.ptRequests : [];
        const submission = data.submission || null;
        console.log("[renderHopes] 希望描画", {
          hopes: hopes.length,
          ptRequests: ptRequests.length,
        });
        const rows = [];
        hopes.forEach((item) => {
          if (item.type === "未入力") return;
          rows.push({
            date: item.date,
            title: item.type,
            storeId: submission ? submission.storeId : "",
            time: [item.start, item.end].filter(Boolean).join("-"),
            kind: "月間希望",
          });
        });
        ptRequests.forEach((item) => {
          rows.push({
            date: item.date,
            title: "PT",
            storeId: item.workStoreId,
            time: [item.start, item.end].filter(Boolean).join("-"),
            kind: "PT申請",
          });
        });
        rows.sort((a, b) => String(a.date).localeCompare(String(b.date)) || a.kind.localeCompare(b.kind));
        elements.hopeList.innerHTML = "";
        if (!rows.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "この月に提出済みの希望はありません。";
          elements.hopeList.append(empty);
          setMessage(elements.hopeMessage, "提出済みの希望は見つかりませんでした。");
          return;
        }
        const fragment = document.createDocumentFragment();
        rows.forEach((row) => {
          const store = state.stores.find((item) => item.storeId === row.storeId);
          const values = [
            { tag: "strong", text: row.date || "-" },
            { tag: "span", text: `${row.kind}: ${row.title}` },
            { tag: "span", text: store ? store.storeName : (row.storeId || "-") },
            { tag: "span", text: row.time || "-" },
          ];
          const rowNode = document.createElement("div");
          rowNode.className = "schedule-row";
          values.forEach((value) => {
            const node = document.createElement(value.tag);
            node.textContent = value.text;
            rowNode.append(node);
          });
          fragment.append(rowNode);
        });
        elements.hopeList.append(fragment);
        setMessage(elements.hopeMessage, "提出済みの希望を表示しました。", "success");
      }

      function applyInitialData(data) {
        // GASから取得したマスタ情報を画面の選択肢へ反映する。
        console.log("[applyInitialData] 初期データ反映開始", data);
        data = normalizeInitialData(data);
        if (!state.session) throw new Error("ログインしている従業員を確認できません。");
        if (!data.areas.length || !data.stores.length) {
          throw new Error("エリアまたは店舗マスタが未登録です。DB管理用スプレッドシートを確認してください。");
        }
        Object.assign(state, {
          areas: data.areas,
          stores: data.stores,
          staff: data.staff,
          staffStoreSettings: data.staffStoreSettings,
        });
        [elements.area, elements.ptArea].forEach((select) => fillSelect(select, state.areas, "エリアを選択", "areaId", "areaName"));
        setLocationDefaults(elements.area, elements.store, elements.employee, state.session.primaryAreaId, state.session.primaryStoreId);
        setLocationDefaults(elements.ptArea, elements.ptStore, elements.ptEmployee, state.session.primaryAreaId, state.session.primaryStoreId, true);
        elements.month.value = getDefaultMonth();
        elements.hopeMonth.value = elements.month.value;
        buildHourOptions(elements.ptStart, "開始", PT_MIN_TIME, PT_MAX_TIME, DEFAULT_START);
        buildHourOptions(elements.ptEnd, "終了", PT_MIN_TIME, PT_MAX_TIME, DEFAULT_END);
        restoreDraft();
        elements.status.textContent = data.accepting ? "受付中" : "受付停止中";
        console.log("[applyInitialData] 初期データ反映完了", {
          areas: state.areas.length,
          stores: state.stores.length,
          staff: state.staff.length,
        });
      }

      function normalizeInitialData(data) {
        const source = data || {};
        return {
          accepting: source.accepting !== false,
          areas: Array.isArray(source.areas) ? source.areas : [],
          stores: Array.isArray(source.stores) ? source.stores : [],
          staff: Array.isArray(source.staff) ? source.staff : [],
          staffStoreSettings: (source.staffStoreSettings || []).map((setting) => ({
            ...setting,
            normalDisplay: setting.normalDisplay !== false,
            helpCandidate: setting.helpCandidate !== false,
          })),
        };
      }

      function hasGoogleRunner() {
        return typeof google !== "undefined" && google.script && google.script.run;
      }

      function bootWithFallback(reason) {
        // GAS外で開いた場合は認証処理を行えないため、案内だけ表示する。
        console.log("[bootWithFallback] フォールバック起動", { reason });
        elements.mainApp.classList.add("is-hidden");
        elements.authView.classList.remove("is-hidden");
        setAuthMessage(elements.loginMessage, reason || "GASのウェブアプリURLから開いてください。", "error");
      }

      function installButtonPressFeedback() {
        document.querySelectorAll("button").forEach((button) => {
          button.addEventListener("pointerdown", () => {
            if (button.disabled) return;
            button.classList.add("is-pressing");
          });
          ["pointerup", "pointercancel", "pointerleave", "blur"].forEach((eventName) => {
            button.addEventListener(eventName, () => {
              window.setTimeout(() => button.classList.remove("is-pressing"), 90);
            });
          });
        });
      }

      document.querySelectorAll(".tabs button").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".tabs button").forEach((item) => item.classList.remove("is-active"));
          document.querySelectorAll(".view").forEach((view) => view.classList.remove("is-active"));
          button.classList.add("is-active");
          document.querySelector(`#${button.dataset.view}`).classList.add("is-active");
        });
      });

      document.querySelectorAll("[data-auth-pane]").forEach((button) => {
        button.addEventListener("click", () => switchAuthPane(button.dataset.authPane));
      });
      elements.loginForm.addEventListener("submit", submitLogin);
      elements.registrationLookupForm.addEventListener("submit", lookupRegistrationEmployee);
      elements.registrationForm.addEventListener("submit", submitRegistration);
      elements.registrationBackButton.addEventListener("click", resetRegistrationVerification);
      elements.passwordChangeButton.addEventListener("click", openPasswordDialog);
      elements.passwordChangeForm.addEventListener("submit", submitPasswordChange);
      elements.passwordChangeCancel.addEventListener("click", closePasswordDialog);
      elements.passwordDialog.addEventListener("click", (event) => {
        if (event.target === elements.passwordDialog) closePasswordDialog();
      });
      elements.logoutButton.addEventListener("click", logoutCurrentUser);

      elements.area.addEventListener("input", () => {
        syncStoreOptions(elements.area, elements.store, elements.employee);
        saveDraft();
      });
      elements.store.addEventListener("input", () => {
        syncEmployeeOptions(elements.store, elements.employee);
        saveDraft();
      });
      elements.employee.addEventListener("input", saveDraft);
      elements.month.addEventListener("input", () => {
        renderCalendar(groupShiftsByDate(collectPayload().shifts));
        saveDraft();
      });
      elements.shiftForm.addEventListener("input", saveDraft);
      elements.shiftForm.addEventListener("submit", submitShift);
      elements.shiftForm.addEventListener("reset", confirmClearShift);
      elements.confirmCancel.addEventListener("click", closeConfirm);
      elements.confirmOk.addEventListener("click", () => {
        const action = pendingConfirmAction;
        closeConfirm();
        if (typeof action === "function") action();
      });
      elements.confirmDialog.addEventListener("click", (event) => {
        if (event.target === elements.confirmDialog) closeConfirm();
      });
      elements.resultClose.addEventListener("click", closeResultDialog);
      elements.resultDialog.addEventListener("click", (event) => {
        if (event.target === elements.resultDialog) closeResultDialog();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && elements.confirmDialog.classList.contains("is-open")) {
          closeConfirm();
        }
        if (event.key === "Escape" && elements.resultDialog.classList.contains("is-open")) {
          closeResultDialog();
        }
        if (event.key === "Escape" && elements.passwordDialog.classList.contains("is-open")) {
          closePasswordDialog();
        }
      });
      document.querySelector("#prevMonth").addEventListener("click", () => moveMonth(-1));
      document.querySelector("#nextMonth").addEventListener("click", () => moveMonth(1));
      document.querySelectorAll("[data-fill]").forEach((button) => button.addEventListener("click", () => fillAll(button.dataset.fill)));

      document.querySelector("#loadHopes").addEventListener("click", loadHopes);

      elements.ptArea.addEventListener("input", () => syncStoreOptions(elements.ptArea, elements.ptStore, elements.ptEmployee, true));
      elements.ptStore.addEventListener("input", () => syncEmployeeOptions(elements.ptStore, elements.ptEmployee, true));
      elements.ptForm.addEventListener("submit", submitPt);

      elements.month.value = getDefaultMonth();
      elements.hopeMonth.value = elements.month.value;
      installButtonPressFeedback();

      if (hasGoogleRunner()) {
        restoreAuthenticatedSession();
      } else {
        bootWithFallback("GAS以外で開いているためログインできません。デプロイしたウェブアプリURLから開いてください。");
      }
    </script>
  </body>
</html>
